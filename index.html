<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fila. · Control de turnos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f3;--card:#fff;--tx:#14201a;--mut:#6a7a70;--bd:#e4e9e3;
  --g:#1f7a4d;--g2:#2a9a62;--gs:#e6f4ec;--gd:#134d31;
  --am:#e8892b;--ams:#fdf1e3;--bl:#5b6fd6;--bls:#eceefb;--rd:#d64545;
  --sh:0 1px 2px rgba(20,32,26,.04),0 8px 24px rgba(20,32,26,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c120f;--card:#141c17;--tx:#e8f0ea;--mut:#8a9c90;--bd:#1f2b24;
  --gs:#173325;--ams:#33250f;--bls:#1b2040;--sh:none;--g:#3fbf80;--g2:#4fd391;--gd:#a6f0c9;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--bd);padding:24px 20px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:12px;font-size:1.7rem;font-weight:800;letter-spacing:-.03em}
.logo i{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--g),var(--g2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:1.2rem;box-shadow:0 6px 16px rgba(31,122,77,.35)}
.logo b{color:var(--g)}
.branch{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bd);border-radius:14px}
.branch .ic{width:38px;height:38px;border-radius:10px;background:var(--gs);display:grid;place-items:center}
.branch strong{display:block;font-size:.95rem}.branch small{color:var(--mut)}
.sec{font-size:.7rem;letter-spacing:.14em;color:var(--mut);font-weight:700;margin:0 0 8px 8px}
nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--mut);text-decoration:none;font-weight:600;margin-bottom:4px;transition:.15s}
nav a:hover{background:var(--bg);color:var(--tx)}
nav a.on{background:var(--gs);color:var(--gd)}
nav a span.ar{margin-left:auto;opacity:.6}
.side-foot{margin-top:auto;display:grid;gap:12px}
.help{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bd);border-radius:14px;text-align:left;width:100%}
.help .ic{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center}
.help small{display:block;color:var(--mut)}
.me{display:flex;align-items:center;gap:12px;padding:4px 8px}
.av{width:40px;height:40px;border-radius:50%;background:#f3e3d3;color:#8a4b1c;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.me small{display:block;color:var(--mut)}
main{padding:0 32px 40px;max-width:1280px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--bd);color:var(--mut);font-size:.9rem}
.top b{color:var(--tx)}
.top .r{display:flex;align-items:center;gap:18px}
.eyebrow{display:flex;align-items:center;gap:12px;margin:32px 0 6px;font-size:.72rem;letter-spacing:.16em;font-weight:700;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--gs);color:var(--g);font-size:.72rem;letter-spacing:0;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:2.4rem;letter-spacing:-.035em;line-height:1.1}
.sub{color:var(--mut);margin:6px 0 0}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:12px;font-weight:700;border:1px solid var(--bd);background:var(--card);transition:.15s;text-decoration:none;color:var(--tx);font-size:.92rem}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.btn.pri{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:0;box-shadow:0 8px 20px rgba(31,122,77,.3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;box-shadow:var(--sh)}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .row{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem}
.stat .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.1rem}
.stat .v{font-size:2.3rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat .v small{font-size:.95rem;font-weight:500;color:var(--mut);letter-spacing:0}
.stat .n{font-size:.78rem;color:var(--mut);display:flex;align-items:center;gap:6px;margin-top:8px}
.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;align-items:start}
.stack{display:grid;gap:20px}
.ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ct h2{margin:0;font-size:1.15rem}
.ct small,.muted{color:var(--mut);font-size:.85rem}
.count{background:var(--ams);color:var(--am);border-radius:99px;padding:2px 9px;font-size:.78rem;font-weight:700;margin-left:8px}
.count.g{background:var(--gs);color:var(--g)}
.now{margin-top:16px;border-radius:18px;padding:22px 24px;background:linear-gradient(160deg,var(--gs),transparent 140%);border:1px solid var(--bd);text-align:center;position:relative}
.now .lbl{position:absolute;left:24px;top:20px;display:flex;align-items:center;gap:8px;font-size:.72rem;letter-spacing:.16em;font-weight:700;color:var(--g)}
.now .voice{position:absolute;right:20px;top:14px;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:7px 14px;font-size:.8rem;color:var(--mut);font-weight:600}
.now .num{font-size:6.5rem;font-weight:800;letter-spacing:-.05em;color:var(--gd);line-height:1;margin:46px 0 6px}
.now .num.flash{animation:pop .6s}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.now .to{color:var(--mut)}.now .to b{background:var(--gs);color:var(--gd);padding:5px 12px;border-radius:8px;margin-left:6px}
.now .foot{display:flex;justify-content:space-between;margin-top:20px;padding-top:14px;border-top:1px solid var(--bd);font-size:.8rem;color:var(--mut)}
.now .foot a{color:var(--g);text-decoration:none;font-weight:600}
.desks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.desk{border:1px solid var(--bd);border-radius:16px;padding:16px;background:var(--bg)}
.desk.busy{background:var(--ams);border-color:transparent}
.desk .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.desk .t .ic{width:34px;height:34px;border-radius:10px;background:var(--gs);display:grid;place-items:center}
.tag{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--gs);color:var(--g);display:inline-flex;align-items:center;gap:6px}
.tag.am{background:var(--card);color:var(--am)}
.desk h3{margin:0;font-size:1.05rem}.desk p{margin:2px 0 14px;font-size:.8rem;color:var(--mut)}
.desk button{width:100%;padding:11px;border-radius:10px;font-weight:700;font-size:.85rem}
.desk .go{background:var(--gs);color:var(--gd)}
.desk .go:hover{background:var(--g);color:#fff}
.desk .stop{background:var(--card);color:var(--am)}
.desk .stop:hover{background:var(--am);color:#fff}
.desk button:disabled{opacity:.45;cursor:not-allowed}
.q{list-style:none;margin:10px 0 0;padding:0}
.q li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd)}
.q li:last-child{border:0}
.q .p{width:32px;height:32px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:.78rem;font-weight:700;color:var(--mut)}
.q li:first-child .p{background:var(--ams);color:var(--am)}
.q b{display:block;font-size:.95rem}.q small{color:var(--mut);font-size:.75rem}
.q time{margin-left:auto;font-size:.78rem;color:var(--mut)}
.more{text-align:center;color:var(--mut);font-size:.8rem;margin-top:10px;padding-top:12px;border-top:1px solid var(--bd)}
.act{list-style:none;margin:10px 0 0;padding:0}
.act li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.act li:last-child{border:0}
.act .i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bls);color:var(--bl);font-size:.9rem}
.act .i.ok{background:var(--gs);color:var(--g)}.act .i.nw{background:var(--ams);color:var(--am)}
.act b{display:block;font-size:.92rem}.act small{color:var(--mut);font-size:.75rem}
.act time{margin-left:auto;font-size:.75rem;color:var(--mut)}
.tip{display:flex;gap:12px;background:var(--ams);border:0;box-shadow:none}
.tip .ic{width:34px;height:34px;border-radius:10px;background:var(--card);display:grid;place-items:center;color:var(--am);flex:none}
.tip p{margin:2px 0 0;font-size:.82rem;color:var(--mut);line-height:1.5}
.foot2{display:flex;justify-content:space-between;color:var(--mut);font-size:.78rem;margin-top:28px}
.ov{position:fixed;inset:0;background:rgba(10,20,14,.55);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--card);border-radius:24px;padding:28px;width:min(520px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal h2{margin:0 0 4px}.modal .opts{display:grid;gap:10px;margin:18px 0}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--bd);border-radius:14px;text-align:left;width:100%;transition:.15s}
.opt:hover{border-color:var(--g);background:var(--gs)}
.opt .l{width:42px;height:42px;border-radius:12px;background:var(--gs);color:var(--g);display:grid;place-items:center;font-weight:800}
.opt small{display:block;color:var(--mut)}
.opt .w{margin-left:auto;color:var(--mut);font-size:.8rem}
.ticket{text-align:center}
.ticket .num{font-size:5.5rem;font-weight:800;letter-spacing:-.05em;color:var(--gd);line-height:1.1}
.sala{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(1200px 700px at 50% 0,var(--gs),var(--bg));padding:28px 48px}
.sala header{display:flex;justify-content:space-between;align-items:center}
.sala .clock{font-size:1.6rem;font-weight:700}
.sala .main{display:grid;grid-template-columns:1.6fr 1fr;gap:32px;align-items:center}
.sala .big{text-align:center}
.sala .big small{letter-spacing:.3em;font-weight:700;color:var(--g);font-size:1rem}
.sala .big .num{font-size:clamp(7rem,20vw,16rem);font-weight:800;letter-spacing:-.06em;color:var(--gd);line-height:1}
.sala .big .num.flash{animation:pop .7s}
.sala .big .to{font-size:2.4rem;font-weight:600;color:var(--mut)}
.sala .big .to b{color:var(--tx)}
.sala .side{display:grid;gap:14px}
.sala .mini{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-radius:18px;background:var(--card);border:1px solid var(--bd);font-size:1.15rem}
.sala .mini b{font-size:2rem;color:var(--gd)}
.sala .mini.idle b{color:var(--mut);opacity:.5}
.sala footer{text-align:center;color:var(--mut)}
.snd{position:fixed;right:20px;bottom:20px}
.hide{display:none!important}
.kiosk{min-height:100vh;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
.kiosk .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:min(900px,100%)}
.kbtn{padding:36px 20px;border-radius:24px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);font-size:1.4rem;font-weight:700;transition:.15s;display:grid;gap:10px;justify-items:center}
.kbtn:hover{transform:translateY(-3px);border-color:var(--g)}
.kbtn .l{width:64px;height:64px;border-radius:18px;background:var(--gs);color:var(--g);display:grid;place-items:center;font-size:1.8rem;font-weight:800}
.kbtn small{font-size:.9rem;color:var(--mut);font-weight:500}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
.mbar,.tabbar{display:none}
.back{position:fixed;left:16px;top:16px;z-index:5;padding:9px 14px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-weight:700;font-size:.85rem}
@media(max-width:820px){
  .app{grid-template-columns:1fr;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  aside{display:none}
  .mbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:12px 16px}
  .mbar .logo{font-size:1.35rem}.mbar .logo i{width:32px;height:32px;border-radius:10px;font-size:1rem}
  .mbar .br{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--mut);font-weight:600}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--bd);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  .tabbar a,.tabbar button{display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:12px;color:var(--mut);text-decoration:none;font-size:.7rem;font-weight:700;min-height:48px}
  .tabbar span{font-size:1.25rem;line-height:1}
  .tabbar .on{background:var(--gs);color:var(--gd)}
  .tabbar .add{color:#fff;background:linear-gradient(135deg,var(--g),var(--g2));box-shadow:0 6px 16px rgba(31,122,77,.35)}
  main{padding:0 16px 24px}
  .top{display:none}
  .eyebrow{margin:20px 0 6px;flex-wrap:wrap;gap:8px}
  h1{font-size:1.75rem}
  .head{gap:14px}
  .btns{width:100%}.btns .btn{flex:1;justify-content:center;padding:14px 12px}
  .btns .btn:not(.pri){display:none}
  .stats{grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 16px}
  .card{padding:16px;border-radius:18px}
  .stat .ic{width:34px;height:34px}.stat .v{font-size:1.7rem}.stat .row{font-size:.8rem}.stat .n{font-size:.7rem}
  .cols{gap:16px}.stack{gap:16px}
  .now{padding:16px}.now .num{font-size:4.6rem;margin:52px 0 4px}
  .now .voice{right:12px;top:10px;padding:6px 10px;font-size:.72rem}.now .lbl{left:16px;top:16px;font-size:.62rem}
  .now .foot{flex-direction:column;gap:6px;align-items:center}
  .desks{grid-template-columns:1fr}
  .desk button{padding:14px;font-size:.92rem}
  .foot2{flex-direction:column;gap:4px;align-items:center}
  .modal{padding:22px;border-radius:22px}
  .ov{align-items:end;padding:0}.ov .modal{width:100%;border-radius:24px 24px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  .sala{padding:64px 16px 20px;grid-template-rows:auto auto auto}
  .sala .main{grid-template-columns:1fr;gap:20px;padding:12px 0}
  .sala .big .to{font-size:1.4rem}
  .sala .side{grid-template-columns:1fr 1fr;gap:10px}
  .sala .mini{padding:12px 14px;font-size:.9rem}.sala .mini b{font-size:1.4rem}
  .sala .clock{font-size:1.1rem}
  .kiosk{padding:68px 16px 32px;gap:20px}.kiosk .grid{grid-template-columns:1fr;gap:12px}
  .kbtn{padding:20px 16px;grid-template-columns:auto 1fr;justify-items:start;text-align:left;font-size:1.1rem;column-gap:16px}
  .kbtn .l{width:52px;height:52px;grid-row:span 2;font-size:1.4rem}
  .snd{left:16px;right:16px;bottom:16px;justify-content:center}
}
@media(max-width:380px){.stats{grid-template-columns:1fr}.now .num{font-size:3.8rem}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SERVICES=[
  {id:'A',name:'Atención general',desc:'Consultas y trámites',avg:6},
  {id:'B',name:'Pagos y cobros',desc:'Caja y facturación',avg:4},
  {id:'C',name:'Reclamos',desc:'Quejas y garantías',avg:10},
  {id:'D',name:'Nuevos clientes',desc:'Alta y registro',avg:8}
];
const svc=id=>SERVICES.find(s=>s.id===id)||SERVICES[0];
const KEY='fila-turnos-v2';
const I={grid:'▦',scr:'▣',ok:'✓',clock:'◔',wait:'≈',plus:'+',arrow:'↗',home:'⌂',call:'↗',spark:'✦',help:'?'};
const pad=n=>String(n).padStart(3,'0');
const tm=t=>new Date(t).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',hour12:false});

function seed(){
  const now=Date.now(),m=60000,q=[];
  [[29,'A',12],[30,'A',11],[31,'B',10],[32,'A',8],[33,'C',6],[34,'D',3]].forEach(([n,s,a])=>q.push({id:s+pad(n),s,at:now-a*m}));
  return{
    n:{A:34,B:31,C:33,D:34},
    q,done:26,voice:true,
    desks:[
      {id:1,cur:null,last:'A026'},
      {id:2,cur:{id:'A027',s:'A',at:now-15*m,since:now-4*m},last:'A027'},
      {id:3,cur:{id:'A028',s:'A',at:now-14*m,since:now-2*m},last:'A028'},
      {id:4,cur:null,last:'A024'}
    ],
    called:{id:'A028',desk:3,at:now-2*m},
    log:[
      {t:'call',id:'A028',desk:3,at:now-2*m},{t:'call',id:'A027',desk:2,at:now-4*m},
      {t:'done',id:'A026',desk:1,at:now-8*m},{t:'done',id:'A025',desk:4,at:now-12*m},{t:'done',id:'A024',desk:4,at:now-15*m}
    ]
  };
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!S||!S.desks)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
const view=()=>(location.hash||'#panel').slice(1).split('?')[0];
let modal=null,lastTicket=null,soundOn=false,spoken=S.called?S.called.at:0,flashId=null;

function addTurn(sid){
  S.n[sid]=(S.n[sid]||0)+1;
  const t={id:sid+pad(S.n[sid]),s:sid,at:Date.now()};
  S.q.push(t);
  S.log.unshift({t:'new',id:t.id,at:t.at});S.log=S.log.slice(0,30);
  save();return t;
}
function callNext(dk){
  const d=S.desks.find(x=>x.id===dk);if(!d||d.cur||!S.q.length)return;
  const t=S.q.shift();
  d.cur={...t,since:Date.now()};d.last=t.id;
  S.called={id:t.id,desk:dk,at:Date.now()};flashId=t.id;
  S.log.unshift({t:'call',id:t.id,desk:dk,at:Date.now()});S.log=S.log.slice(0,30);
  save();
}
function finish(dk){
  const d=S.desks.find(x=>x.id===dk);if(!d||!d.cur)return;
  S.log.unshift({t:'done',id:d.cur.id,desk:dk,at:Date.now()});S.log=S.log.slice(0,30);
  S.done++;d.cur=null;save();
}
function resetAll(){if(confirm('¿Reiniciar todo el sistema con datos de ejemplo?')){S=seed();save();render()}}

function sidebar(v){
  return `<aside>
   <div class="logo"><i>↗</i><span>fila<b>.</b></span></div>
   <div class="branch"><div class="ic">${I.home}</div><div><strong>Sucursal Centro</strong><small>Atención general</small></div></div>
   <div><p class="sec">OPERACIÓN</p><nav>
     <a href="#panel" class="${v==='panel'?'on':''}"><span>${I.grid}</span>Control de turnos</a>
     <a href="#sala" target="_blank"><span>${I.scr}</span>Pantalla de sala<span class="ar">${I.arrow}</span></a>
     <a href="#kiosko" target="_blank"><span>🎫</span>Kiosko de clientes<span class="ar">${I.arrow}</span></a>
   </nav></div>
   <div class="side-foot">
     <button class="help" data-a="reset"><div class="ic">${I.help}</div><div><b>¿Necesitas ayuda?</b><small>Reiniciar datos de ejemplo</small></div></button>
     <div class="me"><div class="av">AM</div><div><b>Andrea Martínez</b><small>Administradora</small></div></div>
   </div></aside>`;
}
function vPanel(){
  const busy=S.desks.filter(d=>d.cur).length;
  const free=S.desks.length-busy;
  const nxt=S.q[0];
  const c=S.called;
  const wait=S.q.length;
  return `<div class="app">${sidebar('panel')}
   <div class="mbar"><div class="logo"><i>↗</i><span>fila<b>.</b></span></div><div class="br"><i class="dot pulse" style="color:var(--g)"></i>Sucursal Centro</div></div><main>
   <div class="top"><span>Operación &nbsp;/&nbsp; <b>Control de turnos</b></span>
     <div class="r"><span>◔ Hoy, ${new Date().toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'})}</span><div class="av" style="width:36px;height:36px">AM</div></div></div>
   <div class="eyebrow">PANEL DE OPERACIÓN <span class="pill"><i class="dot pulse"></i>Sistema en línea</span></div>
   <div class="head"><div><h1>Control de turnos</h1><p class="sub">Gestiona la fila y atiende a cada persona en orden.</p></div>
     <div class="btns"><a class="btn" href="#sala" target="_blank">${I.scr} Ver pantalla pública ${I.arrow}</a>
     <button class="btn pri" data-a="new">${I.plus} Nuevo turno</button></div></div>
   <div class="stats">
     <div class="card stat"><div class="row"><span>En espera</span><div class="ic" style="background:var(--ams);color:var(--am)">${I.wait}</div></div>
       <div class="v">${wait} <small>turnos</small></div><div class="n"><i class="dot" style="color:var(--am)"></i>Próximo: ${nxt?nxt.id:'—'}</div></div>
     <div class="card stat"><div class="row"><span>Atendidos hoy</span><div class="ic" style="background:var(--gs);color:var(--g)">${I.ok}</div></div>
       <div class="v">${S.done} <small>turnos</small></div><div class="n"><i class="dot" style="color:var(--g)"></i>La atención va bien</div></div>
     <div class="card stat"><div class="row"><span>Mesas activas</span><div class="ic" style="background:var(--bls);color:var(--bl)">${I.grid}</div></div>
       <div class="v">${busy} <small>/ ${S.desks.length} mesas</small></div><div class="n"><i class="dot" style="color:var(--bl)"></i>${free} disponibles</div></div>
     <div class="card stat"><div class="row"><span>Hora actual</span><div class="ic" style="background:var(--bls);color:var(--bl)">${I.clock}</div></div>
       <div class="v" id="clk">${new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}</div><div class="n"><i class="dot" style="color:var(--g)"></i>Sucursal abierta</div></div>
   </div>
   <div class="cols"><div class="stack">
     <div class="card"><div class="ct"><div><h2>Turno en atención</h2><small>Así aparece en la pantalla de la sala</small></div></div>
       <div class="now"><div class="lbl"><i class="dot pulse"></i>LLAMADO AHORA</div>
         <button class="voice" data-a="voice">${S.voice?'🔊 Voz activada':'🔇 Voz apagada'}</button>
         <div class="num ${c&&flashId===c.id?'flash':''}">${c?c.id:'—'}</div>
         <div class="to">${c?`Favor de pasar a <b>Mesa ${c.desk}</b>`:'Aún no se ha llamado a nadie'}</div>
         <div class="foot"><span>Último turno llamado &nbsp;<b style="color:var(--tx)">${c?tm(c.at):'—'}</b></span><a href="#sala" target="_blank">Abrir pantalla pública ${I.arrow}</a></div></div></div>
     <div class="card"><div class="ct"><div><h2>Mesas de atención <span class="count g">${S.desks.length}</span></h2><small>Llama al siguiente turno desde una mesa disponible.</small></div>
         <span class="tag"><i class="dot"></i>${free} disponibles</span></div>
       <div class="desks">${S.desks.map(d=>`<div class="desk ${d.cur?'busy':''}">
         <div class="t"><div class="ic">${I.grid}</div><span class="tag ${d.cur?'am':''}"><i class="dot"></i>${d.cur?'En atención':'Disponible'}</span></div>
         <h3>Mesa ${d.id}</h3><p>${d.cur?'Atendiendo <b>'+d.cur.id+'</b> · '+svc(d.cur.s).name:'Último: '+(d.last||'—')}</p>
         ${d.cur?`<button class="stop" data-a="done" data-d="${d.id}">${I.ok} Finalizar atención</button>`
                 :`<button class="go" data-a="call" data-d="${d.id}" ${S.q.length?'':'disabled'}>${I.call} Llamar siguiente</button>`}</div>`).join('')}</div></div>
   </div><div class="stack">
     <div class="card"><div class="ct"><h2>Fila de espera <span class="count">${wait}</span></h2><button style="color:var(--g);font-weight:700;font-size:.85rem" data-a="new">+ Agregar</button></div>
       <small class="muted">Personas esperando atención</small>
       <ul class="q">${S.q.slice(0,6).map((t,i)=>`<li><div class="p">${i+1}</div><div><b>${t.id}</b><small>${svc(t.s).name}</small></div><time>${tm(t.at)}</time></li>`).join('')||'<li><small class="muted">No hay nadie en espera 🎉</small></li>'}</ul>
       ${wait>6?`<div class="more">Y ${wait-6} personas más en espera</div>`:''}</div>
     <div class="card"><div class="ct"><h2>Actividad reciente</h2></div><small class="muted">Últimos movimientos</small>
       <ul class="act">${S.log.slice(0,5).map(l=>`<li><div class="i ${l.t==='done'?'ok':l.t==='new'?'nw':''}">${l.t==='done'?I.ok:l.t==='new'?'+':I.call}</div>
         <div><b>${l.id}</b><small>${l.t==='call'?'Llamado a Mesa '+l.desk:l.t==='done'?'Atención finalizada':'Turno generado'}</small></div><time>${tm(l.at)}</time></li>`).join('')}</ul></div>
     <div class="card tip"><div class="ic">${I.spark}</div><div><b>Consejo rápido</b><p>Los turnos se llaman en orden. Cuando termines, libera la mesa para la siguiente persona.</p></div></div>
   </div></div>
   <div class="foot2"><span><i class="dot" style="color:var(--g)"></i> Todo está sincronizado</span><span>Última actualización: ahora</span></div>
  </main>
   <nav class="tabbar"><a href="#panel" class="on"><span>▦</span>Panel</a><a href="#sala"><span>▣</span>Sala</a><a href="#kiosko"><span>🎫</span>Kiosko</a><button class="add" data-a="new"><span>+</span>Turno</button></nav></div>`;
}
function vSala(){
  const c=S.called;
  return `<div class="sala"><a class="back" href="#panel">← Panel</a><header style="padding-left:0"><div class="logo"><i>↗</i><span>fila<b>.</b></span></div><div class="clock" id="clk">${new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}</div></header>
   <div class="main"><div class="big"><small>TURNO LLAMADO</small><div class="num ${c&&flashId===c.id?'flash':''}">${c?c.id:'—'}</div>
     <div class="to">${c?`Favor de pasar a <b>Mesa ${c.desk}</b>`:'Esperando…'}</div></div>
    <div class="side">${S.desks.map(d=>`<div class="mini ${d.cur?'':'idle'}"><span>Mesa ${d.id}</span><b>${d.cur?d.cur.id:'—'}</b></div>`).join('')}</div></div>
   <footer>En espera: <b>${S.q.length}</b> · Sucursal Centro</footer>
   <button class="btn pri snd ${soundOn?'hide':''}" data-a="snd">🔊 Activar sonido</button></div>`;
}
function vKiosko(){
  return `<div class="kiosk"><a class="back" href="#panel">← Panel</a><div class="logo"><i>↗</i><span>fila<b>.</b></span></div>
   <div><h1>Toma tu turno</h1><p class="sub">Elige el servicio que necesitas</p></div>
   <div class="grid">${SERVICES.map(s=>`<button class="kbtn" data-a="take" data-s="${s.id}"><div class="l">${s.id}</div>${s.name}<small>${s.desc} · ${S.q.filter(t=>t.s===s.id).length} en espera</small></button>`).join('')}</div></div>`;
}
function modalHtml(){
  if(!modal)return '';
  if(modal==='ticket'&&lastTicket){
    const pos=S.q.findIndex(t=>t.id===lastTicket.id)+1;
    return `<div class="ov" data-a="close"><div class="modal ticket"><small class="muted">TU TURNO</small><div class="num">${lastTicket.id}</div>
      <p class="sub">${svc(lastTicket.s).name}</p><p>${pos>1?`Hay <b>${pos-1}</b> persona${pos-1===1?'':'s'} antes que tú · ~${(pos-1)*svc(lastTicket.s).avg} min`:'¡Eres el siguiente!'}</p>
      <button class="btn pri" data-a="close" style="justify-content:center;width:100%">Listo</button></div></div>`;
  }
  return `<div class="ov" data-a="close"><div class="modal"><h2>Nuevo turno</h2><p class="sub">Selecciona el servicio</p>
    <div class="opts">${SERVICES.map(s=>`<button class="opt" data-a="take" data-s="${s.id}"><div class="l">${s.id}</div><div><b>${s.name}</b><small>${s.desc}</small></div><span class="w">${S.q.filter(t=>t.s===s.id).length} en espera</span></button>`).join('')}</div>
    <button class="btn" data-a="close" style="width:100%;justify-content:center">Cancelar</button></div></div>`;
}
function render(){
  const v=view();
  document.getElementById('root').innerHTML=(v==='sala'?vSala():v==='kiosko'?vKiosko():vPanel())+modalHtml();
  document.title=v==='sala'?'fila. · Pantalla de sala':v==='kiosko'?'fila. · Kiosko':'fila. · Control de turnos';
  if(v==='sala')announce();
}
function announce(){
  if(!S.called||S.called.at===spoken)return;
  spoken=S.called.at;
  if(soundOn&&S.voice&&'speechSynthesis' in window){
    const id=S.called.id;
    const u=new SpeechSynthesisUtterance(`Turno ${id[0]} ${parseInt(id.slice(1),10)}, favor de pasar a la mesa ${S.called.desk}`);
    u.lang='es-MX';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  if(b.classList.contains('ov')&&e.target!==b)return;
  const a=b.dataset.a;
  if(a==='new')modal='new';
  else if(a==='close')modal=null;
  else if(a==='take'){lastTicket=addTurn(b.dataset.s);modal='ticket'}
  else if(a==='call')callNext(+b.dataset.d);
  else if(a==='done')finish(+b.dataset.d);
  else if(a==='voice'){S.voice=!S.voice;save()}
  else if(a==='reset')return resetAll();
  else if(a==='snd'){soundOn=true;if('speechSynthesis' in window)speechSynthesis.speak(new SpeechSynthesisUtterance(''))}
  render();
});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{S=JSON.parse(e.newValue);flashId=S.called&&S.called.id}catch{};render()}});
window.addEventListener('hashchange',()=>{modal=null;render()});
setInterval(()=>{const c=document.getElementById('clk');if(c)c.textContent=new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})},15000);
render();
</script>
</body>
</html>
